<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Registration Form - Cobanga School</title>
<style>
body {
    font-family: Arial;
    background: #f4f6f9;
    margin: 0;
}
input, select, textarea {
    width: 100%;
    padding: 8px;
    margin: 5px 0 15px;
}
header {
    background: #1f82e6;
    color: white;
    padding: 15px;
    text-align: center;
}
nav {
    background: #1583f1;
    padding: 10px;
    text-align: center;
}
nav a {
    margin: 0 10px;
    text-decoration: none;
}
button {
    background: #090a0a;
    color: white;
    padding: 10px;
    border: none;
    width: 11.5em;
    cursor: pointer;
    border-radius: 1em;
}
button:hover {
    color: rgb(221, 213, 213);
    background-color: rgb(0, 62, 144);
}
section {
    display: none;
    padding: 10px;
}
.active {
    display: block;
}
.container {
    max-width: 700px;
    margin: auto;
    background: white;
    padding: 10px;
    border-radius: 10px;
}
#footer {
    background: #1e66f5;
    color: white;
    padding: 20px;
    text-align: center;
    margin-top: 20px;
}
</style>
</head>
<body>

<header>
<h2>Cobanga School Permission System</h2>
</header>

<nav>
    <a href="#"><button onclick="showSection('home')"><b>Home</b></button></a>
    <a href="#"><button onclick="showSection('register')"><b>Register</b></button></a>
    <a href="about.html"><button><b>About</b></button></a>
    <a href="contact.html"><button><b>Contact</b></button></a>
    <a href="login form.html"><button><b>Login</b></button></a>
</nav>

<!-- Home Section -->
<section id="home" class="active">
<div class="container">
<h2 style="text-align: center;"><b>Registration Form</b></h2>
<fieldset style="border-radius: 1em; background-color: rgb(156, 163, 167); padding: 20px;">
<form id="regForm">
    <label>Student Name</label>
    <input type="text" id="studentName" placeholder="Enter name" required />

    <label>Class</label>
    <input type="text" id="class" placeholder="Enter class" required />

    <label>Student Code</label>
    <input type="password" id="studentCode" placeholder="Enter student code" required />

    <label>Password</label>
    <input type="password" id="password" placeholder="Enter password" required />

    <label>Gender</label>
    <select id="gender" required>
        <option value="">Gender</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="other">Other</option>
    </select>

    <div style="margin-top: 20px; display:flex; justify-content: space-around;">
        <button type="button" onclick="validateAndSend()">Send</button>
        <button type="reset">Cancel</button>
    </div>
</form>
</fieldset>
</div>
</section>

<!-- Login Page (optional, link in nav) -->
<!-- ... (not included here, but can be added similarly) -->

<div id="footer">
    <b>© light by cobanga 2026</b>
</div>

<script>
function showSection(sectionId) {
    document.querySelectorAll('section').forEach(sec => sec.classList.remove('active'));
    document.getElementById(sectionId).classList.add('active');
}

// Validation before redirecting
function validateAndSend() {
    const name = document.getElementById('studentName').value.trim();
    const cls = document.getElementById('class').value.trim();
    const studentCode = document.getElementById('studentCode').value.trim();
    const password = document.getElementById('password').value.trim();
    const gender = document.getElementById('gender').value;

    if (!name || !cls || !studentCode || !password || !gender) {
        alert('please,fill all fied!');
        return;
    }

    // Niba byuzuye, yohereza ku login form
    window.location.href = "login form.html";
}
</script>

</body>
</html>
