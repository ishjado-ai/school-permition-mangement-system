<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
          .card {
    background: rgb(194, 188, 188);
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    width: 50%;
    height: 50%;
  }
  
  .card h2 {
    margin-bottom: 15px;
    text-align: center;
  }
  
  .card input {
    width: 50%;
    padding: 10px;
    margin: 5px 0;
    border: 1px solid #ccc;
    border-radius: 5px;
    text-align: center;
  
    padding-right: 23px;
  }
  
  button {
    width: 25%;
    padding: 10px;
    margin-top: 10px;
    background: #1e3a8a;
    color: white;
    border: none;
    cursor: pointer;
    border-radius: 5px;
  }
  
  button.cancel {
    background: rgb(209, 50, 50);
  }

    </style>
</head>
<body>
     <div class="card">
    <h2>Login Form</h2>

  <label for="">Email:</label>  <input type="email" placeholder="enter email" style="margin: 3%;"><br>
    <label for="">password:</label><input type="password" placeholder=" enter Password" style="margin: 3%;"><br>
    <button type="reset" style="margin: 3%;">cancel</button>
    <a href="structure.html"><button type="submit " style="margin: 3%;">Login</button></a>
  </div>
</body>
</html>
